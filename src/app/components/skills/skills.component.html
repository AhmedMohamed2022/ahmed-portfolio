<section id="skills" class="skills-section">

  <!-- Figma "skills ticker" marquee, repurposed with real tech stack names -->
  <div class="skills-ticker-wrap" aria-hidden="true">
    <div class="skills-ticker">
      <div class="skills-ticker-track">
        <ng-container *ngFor="let i of [0, 1]">
          <span class="ticker-item" *ngFor="let badge of techBadges">
            {{ badge }}
            <span class="ticker-star">✦</span>
          </span>
        </ng-container>
      </div>
    </div>
  </div>

  <div class="container-page">

    <!-- Header -->
    <div class="skills-header anim-el">
      <span class="section-eyebrow">{{ 'skills.tag' | translate }}</span>
      <h2 class="section-heading">
        {{ 'skills.title' | translate }}
        <span class="section-heading-accent">{{ 'skills.titleAccent' | translate }}</span>
      </h2>
      <p class="skills-subtitle">{{ 'skills.subtitle' | translate }}</p>
    </div>

    <!-- Category cards -->
    <div class="cards-track" #cardsTrack (scroll)="onTrackScroll()">
      <div *ngFor="let cat of categories; let i = index" class="skill-card anim-el"
        [style.--card-delay]="(i * 0.12) + 's'" [style.--cat-color]="cat.color">
        <!-- decorative texture overlay, echoes the 20%-opacity
             background image used behind the Figma Services cards -->
        <div class="skill-card-texture" aria-hidden="true"></div>

        <!-- corner icon chip, echoes the Figma circular arrow-chip -->
        <div class="skill-card-chip">
          <app-icon [name]="cat.icon" [size]="20"></app-icon>
        </div>

        <h3 class="cat-title">{{ cat.title }}</h3>

        <div class="skill-bars">
          <div *ngFor="let skill of cat.skills" class="skill-bar-wrap">
            <div class="skill-bar-meta">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-level">{{ skill.level }}%</span>
            </div>
            <div class="bar-track" [attr.data-level]="skill.level">
              <div class="bar-fill"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination dots — Figma detail, functional here on mobile -->
    <div class="cards-dots">
      <button *ngFor="let cat of categories; let i = index" class="cards-dot" [class.active]="activeIndex === i"
        (click)="scrollToIndex(i)" [attr.aria-label]="cat.title"></button>
    </div>

  </div>
</section>
