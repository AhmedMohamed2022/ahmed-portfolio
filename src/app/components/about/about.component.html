<section id="about" class="about-section">
  <div class="about-panel">
    <div class="container-page about-panel-inner">

      <div class="about-header anim-el">
        <span class="section-eyebrow on-dark">{{ 'about.tag' | translate }}</span>
        <h2 class="section-heading on-dark">
          {{ 'about.title1' | translate }}<br />
          <span class="section-heading-accent">{{ 'about.title2' | translate }}</span>
        </h2>

        <div class="about-bio">
          <p class="about-para" [innerHTML]="'about.p1' | translate"></p>
          <p class="about-para" [innerHTML]="'about.p2' | translate"></p>
          <p class="about-para" [innerHTML]="'about.p3' | translate"></p>
        </div>

        <div class="about-actions">
          <a href="./CV/AhmedMohamedAlsoghayar-CV.pdf" download class="btn-pill-solid">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            {{ 'about.downloadCv' | translate }}
          </a>
          <a href="https://github.com/AhmedMohamed2022" target="_blank" rel="noopener" class="about-github-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.18-1.49 3.14-1.18 3.14-1.18.63 1.59.24 2.76.12 3.05.73.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.2.66.79.55A10.52 10.52 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5Z" />
            </svg>
            {{ 'about.githubProfile' | translate }}
          </a>
        </div>
      </div>

      <div class="highlights-grid">
        <div *ngFor="let h of lang.t()['about']['highlights']; let i = index" class="highlight-card anim-el"
          [style.transition-delay]="(i * 0.08) + 's'">
          <div class="highlight-icon">
            <app-icon [name]="h.icon" [size]="22"></app-icon>
          </div>
          <h3 class="highlight-label">{{ h.label }}</h3>
          <p class="highlight-desc">{{ h.desc }}</p>
        </div>
      </div>

    </div>
  </div>
</section>
