<header class="nav-wrap" [class.scrolled]="isScrolled">
  <nav class="nav-pill">
    <!-- Logo -->
    <a href="#hero" class="nav-logo" (click)="scrollTo('#hero'); $event.preventDefault()">
      <svg class="nav-logo-mark" width="32" height="32" viewBox="0 0 40 40">
        <defs>
          <linearGradient id="navLogoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FEB273" />
            <stop offset="1" stop-color="#FB6514" />
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="11" fill="url(#navLogoGrad)" />
        <polyline points="16 13 10 20 16 27" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"
          stroke-linejoin="round" />
        <line x1="23" y1="12" x2="17" y2="28" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
        <polyline points="24 13 30 20 24 27" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      <span class="nav-logo-word">Ahmed</span>
    </a>

    <!-- Desktop links -->
    <ul class="nav-links">
      <li *ngFor="let link of navLinks">
        <a [href]="link.href" class="nav-link" [class.active]="activeSection === link.href.slice(1)"
          (click)="scrollTo(link.href); $event.preventDefault()">
          {{ link.key | translate }}
        </a>
      </li>
    </ul>

    <!-- Right controls -->
    <div class="nav-controls">
      <button class="lang-toggle" (click)="toggleLang()"
        [title]="lang.isArabic() ? 'Switch to English' : 'التبديل إلى العربية'">
        {{ lang.isArabic() ? 'EN' : 'AR' }}
      </button>

      <a href="./CV/AhmedMohamedAlsoghayar-CV.pdf" download class="nav-cv-btn">
        {{ 'nav.downloadCv' | translate }}
      </a>

      <button class="nav-hamburger" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div class="nav-mobile-menu" [class.open]="menuOpen">
    <ul>
      <li *ngFor="let link of navLinks">
        <a [href]="link.href" [class.active]="activeSection === link.href.slice(1)"
          (click)="scrollTo(link.href); $event.preventDefault()">
          {{ link.key | translate }}
        </a>
      </li>
      <li>
        <a href="./CV/AhmedMohamedAlsoghayar-CV.pdf" download class="nav-mobile-cv">
          {{ 'nav.downloadCv' | translate }}
        </a>
      </li>
    </ul>
  </div>
</header>
